name: Watch Spotlight freshness
on:
  schedule:
    - cron: '32,57 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/health.yml', 'scripts/recover.cjs']
  workflow_dispatch:
    inputs:
      test_notification:
        description: '发送一次明确标注为测试的告警，并自动关闭'
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  actions: write
concurrency:
  group: spotlight-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        with:
          script: |
            const alert = require('./scripts/alert.cjs');
            if (process.env.TEST_NOTIFICATION === 'true') {
              const number = await alert({github,context,core}, '通知通道测试', '这是主动通知测试，不代表网站故障。测试后会自动关闭。');
              await github.rest.issues.createComment({...context.repo, issue_number:number, body:'通知通道测试通过，自动关闭。'});
              await github.rest.issues.update({...context.repo, issue_number:number, state:'closed'});
            }
            let problem = null;
            let stale = false;
            try {
              const site = await fetch('https://jgd-ranking.pages.dev/', {signal:AbortSignal.timeout(30000), headers:{'Cache-Control':'no-cache'}});
              if (!site.ok) throw new Error(`Website HTTP ${site.status}`);
              const response = await fetch('https://raw.githubusercontent.com/lcxFZAC/JGD-Ranking/main/data/latest.json', {signal:AbortSignal.timeout(30000), headers:{'Cache-Control':'no-cache'}});
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const data = await response.json();
              const age = Date.now() - Date.parse(data.crawledAt);
              stale = data.eventId === 28 && Number.isFinite(age) && age > 3.5*3600000;
              if (data.eventId !== 28 || !Number.isFinite(age) || age > 3.5*3600000 || age < -300000) throw new Error(`线上快照无效或超过 3.5 小时未更新：${data.crawledAt}`);
            } catch(error) { problem = `线上新鲜度检查失败：${error.message}`; }
            if (stale) {
              try {
                const recover = require('./scripts/recover.cjs');
                const result = await recover({github,context});
                core.info(result);
                problem += `；${result}`;
                await core.summary.addRaw(result).write();
              } catch (error) { problem += `；自动补触发失败：${error.message}`; }
            }
            await alert({github,context,core}, '网站数据过期或不可访问', problem);
            if (problem) core.setFailed(problem);
