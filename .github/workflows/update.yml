name: Update Spotlight dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: '抓取最新数据并提交 GitHub；关闭时仅校验'
        type: boolean
        default: false
      full_discovery:
        description: '重新核对公开目录（首次或补全名单时使用，耗时较长）'
        type: boolean
        default: false
  schedule:
    - cron: '5 3,6,9,12,15,18,21 * * *'
    - cron: '5 0 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: spotlight-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore membership cache
        uses: actions/cache@v4
        with:
          path: .cache/membership
          key: spotlight-membership-${{ github.run_id }}
          restore-keys: spotlight-membership-
      - name: Refresh catalogue membership
        id: discovery
        continue-on-error: true
        timeout-minutes: 30
        # Daily at 00:05 UTC, or explicitly requested. Ordinary updates use the registry.
        if: inputs.full_discovery || github.event.schedule == '5 0 * * *'
        run: python scripts/discovery.py
      - name: Fetch current statistics
        id: crawl
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.full_discovery
        run: python scripts/crawl.py
      - name: Verify and build
        run: |
          python -m unittest discover -s tests -v
          node --check app.js
          node tests/test_alert.cjs
          node scripts/build.js
      - name: Save verified snapshots
        if: github.event_name == 'schedule' || inputs.refresh_data || inputs.full_discovery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh Spotlight snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Report update failure or recovery
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          DISCOVERY_RESULT: ${{ steps.discovery.outcome }}
        with:
          script: |
            const alert = require('./scripts/alert.cjs');
            await alert({github,context,core}, '抓取或发布准备失败', process.env.JOB_STATUS !== 'success' ? '更新任务失败或取消，保留上次发布数据。请检查日志。' : null);
            if (process.env.DISCOVERY_RESULT === 'failure' || process.env.DISCOVERY_RESULT === 'success') {
              await alert({github,context,core}, '参赛目录补查失败', process.env.DISCOVERY_RESULT === 'failure' ? '目录补查失败，已继续更新现有名单指标；待下次补查恢复。' : null);
            }
