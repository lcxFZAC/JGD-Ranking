name: Update Spotlight dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: '抓取最新数据并提交 GitHub；关闭时仅校验'
        type: boolean
        default: false
      full_discovery:
        description: '重新核对公开目录（首次或补全名单时使用，耗时较长）'
        type: boolean
        default: false
  schedule:
    # Off-peak checks; collect once per three-hour window.
    - cron: '17,47 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  # Read-only push validation must not queue behind a long catalogue refresh.
  group: ${{ github.event_name == 'push' && 'spotlight-validation' || 'spotlight-data' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore membership cache
        uses: actions/cache@v4
        with:
          path: .cache/membership
          key: spotlight-membership-${{ github.run_id }}
          restore-keys: spotlight-membership-
      - name: Decide whether this hour needs a refresh
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REFRESH_DATA: ${{ inputs.refresh_data }}
          FULL_DISCOVERY: ${{ inputs.full_discovery }}
        run: python scripts/refresh_due.py
      - name: Fetch current statistics
        id: crawl
        if: steps.due.outputs.refresh == 'true'
        run: python scripts/crawl.py
      - name: Verify and build
        run: |
          python -m unittest discover -s tests -v
          node --check app.js
          node --check data-client.js
          node tests/test_recover.cjs
          node tests/test_alert.cjs
          node tests/test_refresh.cjs
          node tests/test_build.cjs
          node tests/test_shell_cache.cjs
      - name: Save verified snapshots
        if: steps.crawl.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/registry.json data/catalogue.json data/version.json
          if ! git diff --cached --quiet; then
            git commit -m "[CF-Pages-Skip] chore(data): refresh Spotlight snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      # Catalogue discovery must not delay publication of current statistics.
      - name: Refresh catalogue membership
        id: discovery
        continue-on-error: true
        timeout-minutes: 30
        if: steps.due.outputs.discovery == 'true'
        run: |
          discovery_status=0
          python scripts/discovery.py || discovery_status=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry.json data/discovery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "[CF-Pages-Skip] chore(data): refresh verified catalogue"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          exit "$discovery_status"
      - name: Report update failure or recovery
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          CRAWL_RESULT: ${{ steps.crawl.outcome }}
          DISCOVERY_COMPLETE: ${{ steps.discovery.outputs.complete }}
          DISCOVERY_RESULT: ${{ steps.discovery.outcome }}
        with:
          script: |
            const alert = require('./scripts/alert.cjs');
            if (process.env.JOB_STATUS !== 'success' || process.env.CRAWL_RESULT === 'success') {
              await alert({github,context,core}, '抓取或发布准备失败', process.env.JOB_STATUS !== 'success' ? '更新任务失败或取消，保留上次发布数据。请检查日志。' : null);
            }
            if (process.env.DISCOVERY_RESULT === 'failure' || (process.env.DISCOVERY_RESULT === 'success' && process.env.DISCOVERY_COMPLETE === 'true')) {
              await alert({github,context,core}, '参赛目录补查失败', process.env.DISCOVERY_RESULT === 'failure' ? '目录补查失败，已继续更新现有名单指标；待下次补查恢复。' : null);
            }
